services:
  app:
    build: .
    image: tg-manage-telebox:local
    container_name: tg-manage
    ports:
      - "8080:8080"
    # 单账号 TeleBox V8 老生代默认 128 MiB；实际进程还包含原生内存。
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - ./data:/data
    environment:
      - PORT=8080
      - APP_DATA_DIR=/data
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - APP_SCHEDULER_LOCK=1
      - TG_GLOBAL_CONCURRENCY=${TG_GLOBAL_CONCURRENCY:-2}
      - TELEBOX_NODE_HEAP_MB=${TELEBOX_NODE_HEAP_MB:-128}
      - TB_PREFIX=${TB_PREFIX:-}
      - TB_LISTENER_HANDLE_EDITED=${TB_LISTENER_HANDLE_EDITED:-}
      - TB_CMD_IGNORE_EDITED=${TB_CMD_IGNORE_EDITED:-}
      - TG_MANAGE_TG_API_ID=${TG_MANAGE_TG_API_ID:-}
      - TG_MANAGE_TG_API_HASH=${TG_MANAGE_TG_API_HASH:-}
      # 旧部署的私有 .env 继续读取，升级时无需改动账号数据。
      - SIGNPULSE_TG_API_ID=${SIGNPULSE_TG_API_ID:-}
      - SIGNPULSE_TG_API_HASH=${SIGNPULSE_TG_API_HASH:-}
      - TG_API_ID=${TG_API_ID:-}
      - TG_API_HASH=${TG_API_HASH:-}
      # - ENABLE_API_DOCS=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/__pycache__
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
