# 面板生产/自建部署参考。密钥请用 .env 或 secrets 注入，勿提交真实密码。
services:
  app:
    build: .
    image: tg-manage-telebox:local
    container_name: tg-manage-panel
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=3000
      - PORT=3000
      - APP_DATA_DIR=/data
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      # APP_SECRET_KEY 首次启动自动生成并写入 data/.app_secret_key。
      # 管理员在首次网页设置流程中设定密码。
      # 单实例保持 1；多 API 副本时仅写节点持锁
      - APP_SCHEDULER_LOCK=1
      # Leave blank so the backend chooses a cgroup-aware CPU default; set TG_GLOBAL_CONCURRENCY to override.
      - TG_GLOBAL_CONCURRENCY=${TG_GLOBAL_CONCURRENCY:-}
      - TELEBOX_NODE_HEAP_MB=${TELEBOX_NODE_HEAP_MB:-128}
      - TB_PREFIX=${TB_PREFIX:-}
      - TB_LISTENER_HANDLE_EDITED=${TB_LISTENER_HANDLE_EDITED:-}
      - TB_CMD_IGNORE_EDITED=${TB_CMD_IGNORE_EDITED:-}
      - TG_MANAGE_TG_API_ID=${TG_MANAGE_TG_API_ID:-}
      - TG_MANAGE_TG_API_HASH=${TG_MANAGE_TG_API_HASH:-}
      - SIGNPULSE_TG_API_ID=${SIGNPULSE_TG_API_ID:-}
      - SIGNPULSE_TG_API_HASH=${SIGNPULSE_TG_API_HASH:-}
      - TG_API_ID=${TG_API_ID:-}
      - TG_API_HASH=${TG_API_HASH:-}
      # 可选：Postgres
      # - APP_DATABASE_URL=postgresql+psycopg2://user:pass@db:5432/tg_manage
      # 可选：监听分片（多实例时）
      # - APP_MONITOR_SHARD=0/2
      # - APP_MONITOR_ACCOUNT_ALLOWLIST=
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
