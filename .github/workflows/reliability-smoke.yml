name: Reliability smoke checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Python test suite
        env:
          APP_DATA_DIR: ${{ runner.temp }}/tg-manage-test-data
        run: python -m pytest -q -o addopts=''

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, build and test frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          npm test --prefix frontend

  compose-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce session permission repair with each Compose capability set
        shell: bash
        run: |
          set -euo pipefail
          for compose in docker-compose.yml docker-compose.panel.yml; do
            docker compose -f "$compose" config --quiet
            mapfile -t caps < <(docker compose -f "$compose" config --format json |
              python3 -c 'import json, sys; print("\n".join("--cap-add=" + cap for cap in json.load(sys.stdin)["services"]["app"]["cap_add"]))')
            test "${#caps[@]}" -ge 5
            data_dir="$(mktemp -d)"
            mkdir -p "$data_dir/sessions/.pending-logins"
            printf 'test-session\n' > "$data_dir/sessions/account.session_string"
            sudo chown -R 20000:20000 "$data_dir"
            sudo chmod -R 700 "$data_dir"
            docker run --rm --cap-drop=ALL "${caps[@]}" \
              --security-opt=no-new-privileges \
              --mount "type=bind,src=$data_dir,dst=/data" \
              debian:bookworm-slim sh -eu -c '
                chown -R 10001:10001 /data
                chmod -R u+rwX /data
                find /data/sessions -type d -exec chmod 700 {} +
                find /data/sessions -type f -exec chmod 600 {} +
                test "$(stat -c %a /data/sessions)" = 700
                test "$(stat -c %a /data/sessions/account.session_string)" = 600
              '
          done
